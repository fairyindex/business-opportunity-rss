name: Test AIHOT content access
on:
  push:
    paths:
      - .github/workflows/test-aihot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and summarize AIHOT
        run: |
          python - <<'PY'
          import json,re,time,urllib.error,urllib.parse,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          terms=['创业','收入','营收','变现','小团队','独立开发','产品','商业化','客户','电商','广告','营销','设计','创意','视频','内容','自动化','工作流','agent','SaaS','定制','销售','商家','订阅','工具']
          def clean(x,n=180):
              return re.sub(r'[\r\n|\[\]<>]+',' ',str(x or ''))[:n]
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'aihot-api/2.0.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.headers.get('content-type',''),json.loads(r.read(1500000)),''
              except urllib.error.HTTPError as e:
                  return e.code,'',{},clean(e.read(500).decode('utf-8',errors='replace'))
              except Exception as e:
                  return 'ERR','',{},clean(type(e).__name__+': '+str(e))
          lines=['# AIHOT 实际接口获取测试','','检查时间：'+datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),'','|时间窗|类别|HTTP状态|返回条数|错误|','|---|---|---|---:|---|']
          candidates={}
          for win in ['24h','7d']:
              for cat in ['ai-products','tip','industry']:
                  params=urllib.parse.urlencode({'mode':'selected','window':win,'category':cat,'limit':40})
                  code,ct,obj,error=fetch('https://aihot.news/api/v1/items?'+params)
                  items=obj.get('items',[]) if isinstance(obj,dict) else []
                  if not isinstance(items,list): items=[]
                  lines.append(f'|{win}|{cat}|{code}|{len(items)}|{clean(error,120)}|')
                  for x in items:
                      if not isinstance(x,dict): continue
                      title=clean(x.get('title') or x.get('originalTitle'),240)
                      links=x.get('links') or {}
                      if not isinstance(links,dict):links={}
                      link=links.get('original') or links.get('aihot') or ''
                      if not isinstance(link,str) or not link.startswith('https://'):link=''
                      summary=clean(x.get('summary') or x.get('description') or x.get('reason'),260)
                      source=x.get('source') or {}
                      if isinstance(source,dict): source=source.get('name','')
                      dt=clean(x.get('publishedAt') or x.get('createdAt'),40)
                      score=sum(2 if term.lower() in title.lower() else 1 for term in terms if term.lower() in (title+' '+summary).lower())
                      if title:
                          key=link or title
                          if key not in candidates or win=='24h':
                              candidates[key]=(score,dt,cat,title,link,summary,clean(source,80))
                  time.sleep(.35)
          code,ct,obj,error=fetch('https://aihot.news/api/v1/dailies/latest')
          lines.append(f'|latest|daily|{code}|—|{clean(error,120)}|')
          lines+=['','原始JSON响应中根字段：'+clean(list(obj.keys()) if isinstance(obj,dict) else '',200),'','## 候选线索（只是摘要，尚未核验原文）','']
          sorted_items=sorted(candidates.values(),key=lambda z:(z[0],z[1]),reverse=True)
          lines.append(f'去重后的候选条数：{len(sorted_items)}。以下最多显示40条。')
          for i,(score,dt,cat,title,link,summary,source) in enumerate(sorted_items[:40],1):
              display=f'[{title}]({link})' if link else title
              lines+=['',f'{i}. **{display}**','   '+f'分类：{cat} · 日期：{dt or "未知"} · 来源：{source or "未知"} · 相关词分：{score}','   '+summary]
          Path('aihot-test.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('results:',len(sorted_items),'statuses:',lines[6:13])
          PY
      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aihot-test.md
          if git diff --cached --quiet; then
            echo "Unchanged"
          else
            git commit -m "Record AIHOT API integration test"
            git push
          fi
